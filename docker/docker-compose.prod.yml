name: bankcore

services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: bankcore-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/swagger:/usr/share/nginx/swagger:ro
      - web-dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/log/nginx:/var/log/nginx
    networks:
      - auth-net
      - trans-net
    depends_on:
      - auth-api
      - trans-api

  auth-api:
    build:
      context: ..
      dockerfile: src/Services/AuthService/Api/Dockerfile
    container_name: bankcore-auth-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AuthDb: Host=auth-db;Port=5432;Database=auth_db;Username=${AUTH_DB_USER};Password=${AUTH_DB_PASS}
      KEY_DIR: /keys
      Swagger__PathBase: /swagger/auth
    volumes:
      - auth-keys:/keys
    networks:
      - auth-net
    depends_on:
      - auth-db

  auth-db:
    image: postgres:16-alpine
    container_name: bankcore-auth-db
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASS}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - auth-net

  trans-api:
    build:
      context: ..
      dockerfile: src/Services/TransactionsService/Api/Dockerfile
    container_name: bankcore-trans-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TransDb: Host=trans-db;Port=5432;Database=trans_db;Username=${TRANS_DB_USER};Password=${TRANS_DB_PASS}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASS}
      Auth__PublicKeyPath: /keys/auth-public.pem
      Swagger__PathBase: /swagger/transactions
    volumes:
      - auth-keys:/keys:ro
    networks:
      trans-net:
        aliases:
          - transactions-api
    depends_on:
      - trans-db
      - redis

  trans-db:
    image: postgres:16-alpine
    container_name: bankcore-trans-db
    restart: always
    environment:
      POSTGRES_DB: trans_db
      POSTGRES_USER: ${TRANS_DB_USER}
      POSTGRES_PASSWORD: ${TRANS_DB_PASS}
    volumes:
      - trans_db_data:/var/lib/postgresql/data
    networks:
      - trans-net

  redis:
    image: redis:7-alpine
    container_name: bankcore-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis_data:/data
    networks:
      - trans-net

volumes:
  auth_db_data:
  trans_db_data:
  redis_data:
  auth-keys:
  web-dist:

networks:
  auth-net:
    driver: bridge
  trans-net:
    driver: bridge
