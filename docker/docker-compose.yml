name: bankcore

services:
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: bankcore
      POSTGRES_PASSWORD: bankcore-dev
      POSTGRES_DB: bankcore_auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankcore -d bankcore_auth"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [auth_net]

  trans-db:
    image: postgres:16
    environment:
      POSTGRES_USER: bankcore
      POSTGRES_PASSWORD: bankcore-dev
      POSTGRES_DB: bankcore_trans
    volumes:
      - trans-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankcore -d bankcore_trans"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [trans_net]

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks: [trans_net]

  auth-api:
    build:
      context: ..
      dockerfile: src/Services/AuthService/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Auth: Host=auth-db;Port=5432;Database=bankcore_auth;Username=bankcore;Password=bankcore-dev
      KEY_DIR: /keys
      Swagger__PathBase: /swagger/auth
    volumes:
      - auth-keys:/keys
    depends_on:
      auth-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5081:8080"
    networks: [edge, auth_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  transactions-api:
    build:
      context: ..
      dockerfile: src/Services/TransactionsService/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Bank: Host=trans-db;Port=5432;Database=bankcore_trans;Username=bankcore;Password=bankcore-dev
      Auth__PublicKeyPath: /keys/auth-public.pem
      Redis: redis:6379
      Swagger__PathBase: /swagger/transactions
    volumes:
      - auth-keys:/keys:ro
    depends_on:
      auth-api:
        condition: service_healthy
      trans-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5082:8080"
    networks: [edge, trans_net]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/swagger:/usr/share/nginx/swagger:ro
      - web-dist:/usr/share/nginx/html:ro
    depends_on:
      - auth-api
      - transactions-api
    networks: [edge]

networks:
  edge:
  auth_net:
  trans_net:

volumes:
  auth-data:
  trans-data:
  auth-keys:
  web-dist:
